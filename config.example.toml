[general]
interactive = true
show_fps = false
fps_report_interval_secs = 1
scale_mode = "cover"
force_scene_audio_loop = false

[renderer]
library_path = ""
source = "/path/to/Steam/steamapps/workshop/content/431960/<wallpaper-id>"
assets_path = "/path/to/Steam/steamapps/common/wallpaper_engine/assets"
cache_path = "~/.cache/we-layerd/renderer"
prefer_dmabuf = true
allow_shm_fallback = true
fps = 60
# Global upper bound; per-wallpaper fps values cannot exceed it.
max_fps = 60
speed = 1.0
volume = 1.0
muted = false
msaa_samples = 1
options_json = '''
{
  "example": true
}
'''

[integrations]
# MPRIS playback state and track metadata are forwarded to compatible scene wallpapers.
media = true
# Desktop audio capture is opt-in because it runs continuously while enabled.
audio_spectrum = false
audio_source = "@DEFAULT_MONITOR@"
audio_sample_rate = 48000
audio_update_hz = 30

[rules]
# Window rules are per output when zwlr_foreign_toplevel_manager_v1 is available.
# Values: "keep", "mute", "pause".
focused = "keep"
maximized = "keep"
fullscreen = "keep"

# Runs asynchronously after an output presents the first frame of a successful apply or switch.
# [hooks.wallpaper_applied]
# command = "~/.local/bin/we-theme-sync"
# args = []

# Optional daemon-managed playlist. The GUI can create and edit these entries.
# [playlists]
# active = "Daily"
#
# [playlists.definitions.Daily]
# mode = "repeat"
# default_duration_ms = 1800000
#
# [[playlists.definitions.Daily.items]]
# wallpaper_id = "1234567890"
# source = "/path/to/Steam/steamapps/workshop/content/431960/1234567890"

# Optional per-output layer-shell bindings. Keys are stable wl_output.name values.
# A binding is either wallpaper_id + source OR playlist, never both.
# [outputs."DP-1"]
# wallpaper_id = "1234567890"
# source = "/path/to/Steam/steamapps/workshop/content/431960/1234567890"
#
# [outputs."HDMI-A-1"]
# playlist = "Daily"
