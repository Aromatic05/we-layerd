name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Match tag to package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tag must use vMAJOR.MINOR.PATCH, got %s\n' "${tag}" >&2
            exit 1
          fi

          version="${tag#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          if [[ "${version}" != "${manifest_version}" ]]; then
            printf 'Tag version %s does not match Cargo.toml version %s\n' \
              "${version}" "${manifest_version}" >&2
            exit 1
          fi

          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

  ubuntu:
    name: Ubuntu 26.04 DEB
    needs: validate
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential bzip2 ca-certificates cargo cmake curl \
            debhelper devscripts dpkg-dev fakeroot file git libasound2-dev \
            libdrm-dev libfontconfig1-dev libfreetype-dev libgl-dev \
            libgstreamer-plugins-bad1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev libgtk-3-dev liblz4-dev libpango1.0-dev \
            libva-dev libvulkan-dev libwayland-dev libxdo-dev \
            libxkbcommon-dev patchelf pkg-config rustc tar wayland-protocols \
            xdotool xz-utils

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build DEB package
        shell: bash
        run: package/ubuntu/build.sh

      - name: Collect DEB package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find package/ubuntu/out -maxdepth 1 -type f -name '*.deb' \
            -exec cp -v {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-ubuntu-amd64
          path: release-assets/*.deb
          if-no-files-found: error

  fedora:
    name: Fedora 43 RPM
    needs: validate
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install \
            alsa-lib-devel binutils bzip2 ca-certificates cargo cef cef-devel \
            cmake curl desktop-file-utils findutils fontconfig-devel \
            freetype-devel gcc-c++ git gstreamer1-devel \
            gstreamer1-plugins-bad-free-devel gstreamer1-plugins-base-devel \
            gtk3-devel libatomic libdrm-devel libva-devel libxdo-devel \
            libxkbcommon-devel lz4-devel mesa-libGL-devel pango-devel \
            patchelf pkgconf-pkg-config rpm-build rpmdevtools rust tar \
            vulkan-headers vulkan-loader-devel wayland-devel \
            wayland-protocols-devel xdotool xz

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build RPM package
        shell: bash
        run: package/fedora/build.sh

      - name: Collect binary RPM package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find package/fedora/out/RPMS -type f -name '*.rpm' \
            -exec cp -v {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.rpm' -print -quit)"

      - name: Upload Fedora artifact
        uses: actions/upload-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-fedora-x86_64
          path: release-assets/*.rpm
          if-no-files-found: error

  appimage:
    name: Ubuntu 24.04 AppImage
    needs: validate
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential bzip2 ca-certificates cmake curl file git \
            gstreamer1.0-libav gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-tools libasound2-dev libdrm-dev libfontconfig1-dev \
            libfreetype-dev libgl-dev libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libgtk-3-dev liblz4-dev libpango1.0-dev libva-dev libvulkan-dev \
            libwayland-dev libxdo-dev libxkbcommon-dev patchelf pkg-config \
            tar wayland-protocols xdotool xz-utils

      - name: Install current Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          printf '%s\n' "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build AppImage
        shell: bash
        run: package/appimage/build.sh

      - name: Collect AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          artifact="package/appimage/out/we-layerd-${{ needs.validate.outputs.version }}-x86_64.AppImage"
          test -f "${artifact}"
          cp -v "${artifact}" release-assets/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-appimage-x86_64
          path: release-assets/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - ubuntu
      - fedora
      - appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' artifact; do
            filename="$(basename -- "${artifact}")"
            if [[ -e "release-assets/${filename}" ]]; then
              printf 'Duplicate release asset name: %s\n' "${filename}" >&2
              exit 1
            fi
            cp -v "${artifact}" "release-assets/${filename}"
          done < <(find downloaded-artifacts -type f -print0)

          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          sha256sum release-assets/* > release-assets/SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* \
              --verify-tag \
              --title "we-layerd ${VERSION}" \
              --generate-notes
          fi
