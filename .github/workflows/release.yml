name: Release binaries

on:
  push:
    tags:
      - "v*"
      - "dev-*"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.96.1"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CMAKE_BUILD_PARALLEL_LEVEL: "1"
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  MAKEFLAGS: "-j1"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate build ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          if [[ -z "${manifest_version}" ]]; then
            printf 'Failed to read package version from Cargo.toml\n' >&2
            exit 1
          fi
          if [[ ! "${manifest_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Package version must use MAJOR.MINOR.PATCH, got %s\n' \
              "${manifest_version}" >&2
            exit 1
          fi

          is_release=false
          tag=""

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Release tag must use vMAJOR.MINOR.PATCH, got %s\n' "${tag}" >&2
              exit 1
            fi
            tag_version="${tag#v}"
            if [[ "${tag_version}" != "${manifest_version}" ]]; then
              printf 'Tag version %s does not match Cargo.toml version %s\n' \
                "${tag_version}" "${manifest_version}" >&2
              exit 1
            fi
            is_release=true
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == dev-* ]]; then
            :
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            :
          else
            printf 'Unsupported release workflow trigger: %s %s/%s\n' \
              "${GITHUB_EVENT_NAME}" "${GITHUB_REF_TYPE}" "${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          {
            printf 'version=%s\n' "${manifest_version}"
            printf 'is_release=%s\n' "${is_release}"
            printf 'tag=%s\n' "${tag}"
          } >> "${GITHUB_OUTPUT}"

  build-ubuntu:
    name: Compile for Ubuntu 26.04
    needs: validate
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 50
    steps:
      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            binutils build-essential bzip2 ca-certificates cmake curl file git \
            libasound2-dev libdrm-dev libfontconfig1-dev libfreetype-dev \
            libgl-dev libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libgtk-3-dev liblz4-dev libpango1.0-dev libva-dev libvulkan-dev \
            libwayland-dev libxdo-dev libxkbcommon-dev pkg-config tar \
            wayland-protocols xz-utils zstd

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up stable build caches
        id: setup
        uses: ./.github/actions/setup-release-build
        with:
          cache-namespace: ubuntu2604
          source-cache-key: ${{ hashFiles('Cargo.lock') }}
          download-cache-key: ${{ hashFiles('package/common/versions.env') }}

      - name: Prepare pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          source package/common/versions.env
          package/common/fetch-dependencies.sh all

          vendor_root="${GITHUB_WORKSPACE}/../.we-layerd-cache/ubuntu2604/vendor"
          rm -rf "${vendor_root}"
          mkdir -p "${vendor_root}/cef" "${vendor_root}/dxc"
          tar -xjf "${WE_LAYERD_DOWNLOAD_CACHE}/${CEF_ARCHIVE}" \
            -C "${vendor_root}/cef" --strip-components=1
          tar -xzf "${WE_LAYERD_DOWNLOAD_CACHE}/${DXC_ARCHIVE}" \
            -C "${vendor_root}/dxc"

          {
            printf 'CEF_ROOT=%s\n' "${vendor_root}/cef"
            printf 'DXC_ROOT=%s\n' "${vendor_root}/dxc"
            printf 'CMAKE_PREFIX_PATH=%s\n' "${vendor_root}/dxc"
          } >> "${GITHUB_ENV}"
          printf '%s/bin\n' "${vendor_root}/dxc" >> "${GITHUB_PATH}"

      - name: Fetch locked Rust dependencies
        shell: bash
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            cargo fetch --locked

      - name: Build reusable Rust dependency graph
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 25m \
            cargo build --frozen --offline --release \
              -p we-core -p we-renderer-sys -p we-renderer -p we-gui -p xtask

      - name: Save Rust build checkpoint
        if: steps.setup.outputs.rust-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.cargo-target-dir }}
          key: ${{ steps.setup.outputs.rust-cache-key }}

      - name: Build native renderer checkpoint
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 22m \
            package/common/build-native.sh

      - name: Save completed native renderer
        if: steps.setup.outputs.native-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.native-install-root }}
          key: ${{ steps.setup.outputs.native-cache-key }}

      - name: Build final daemon binary
        shell: bash
        env:
          WE_LAYERD_INSTALL_PREFIX: /usr
          WE_LAYERD_PREBUILT_RENDERER_ROOT: ${{ steps.setup.outputs.native-install-root }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            cargo build --frozen --offline --release -p we-layerd

      - name: Stage reusable release bundle
        if: needs.validate.outputs.is_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prebuilt
          mkdir -p prebuilt/bin prebuilt/lib
          install -m0755 "${CARGO_TARGET_DIR}/release/we-layerd" prebuilt/bin/we-layerd
          install -m0755 "${CARGO_TARGET_DIR}/release/we-gui" prebuilt/bin/we-gui
          install -m0755 \
            "${WE_LAYERD_NATIVE_INSTALL_ROOT}/lib/libwallpaper-engine-renderer.so" \
            prebuilt/lib/libwallpaper-engine-renderer.so
          install -m0755 \
            "${WE_LAYERD_NATIVE_INSTALL_ROOT}/lib/we-cef-helper" \
            prebuilt/lib/we-cef-helper

      - name: Upload Ubuntu prebuilt checkpoint
        if: needs.validate.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-ubuntu2604-prebuilt
          path: prebuilt
          if-no-files-found: error
          retention-days: 7

      - name: Report shared compiler cache
        if: always()
        shell: bash
        run: sccache --show-stats || true

  ubuntu:
    name: Package Ubuntu 26.04 DEB
    if: needs.validate.outputs.is_release == 'true'
    needs:
      - validate
      - build-ubuntu
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      - name: Install packaging dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            binutils build-essential bzip2 ca-certificates curl debhelper \
            devscripts dpkg-dev fakeroot file git libasound2-dev libdrm-dev \
            libfontconfig1-dev libfreetype-dev libgl-dev \
            libgstreamer-plugins-bad1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev libgtk-3-dev liblz4-dev libpango1.0-dev \
            libva-dev libvulkan-dev libwayland-dev libxdo-dev \
            libxkbcommon-dev patchelf pkg-config tar wayland-protocols \
            xdotool xz-utils zstd

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up packaging inputs
        uses: ./.github/actions/setup-release-build
        with:
          cache-namespace: ubuntu2604-package
          source-cache-key: ${{ hashFiles('Cargo.lock') }}
          download-cache-key: ${{ hashFiles('package/common/versions.env') }}
          restore-build-caches: "false"

      - name: Download Ubuntu prebuilt checkpoint
        uses: actions/download-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-ubuntu2604-prebuilt
          path: prebuilt

      - name: Build DEB package without recompiling
        shell: bash
        run: WE_LAYERD_PREBUILT_ROOT="${GITHUB_WORKSPACE}/prebuilt" package/ubuntu/build.sh

      - name: Collect DEB package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find package/ubuntu/out -maxdepth 1 -type f -name '*.deb' \
            -exec cp -v {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-ubuntu-amd64
          path: release-assets/*.deb
          if-no-files-found: error

  build-appimage:
    name: Compile for Ubuntu 24.04
    needs: validate
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 50
    steps:
      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            binutils build-essential bzip2 ca-certificates cmake curl file git \
            libasound2-dev libdrm-dev libfontconfig1-dev libfreetype-dev \
            libgl-dev libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libgtk-3-dev liblz4-dev libpango1.0-dev libva-dev libvulkan-dev \
            libwayland-dev libxdo-dev libxkbcommon-dev pkg-config tar \
            wayland-protocols xz-utils zstd

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up stable build caches
        id: setup
        uses: ./.github/actions/setup-release-build
        with:
          cache-namespace: ubuntu2404
          source-cache-key: ${{ hashFiles('Cargo.lock') }}
          download-cache-key: ${{ hashFiles('package/common/versions.env') }}

      - name: Prepare pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          source package/common/versions.env
          package/common/fetch-dependencies.sh appimage

          vendor_root="${GITHUB_WORKSPACE}/../.we-layerd-cache/ubuntu2404/vendor"
          rm -rf "${vendor_root}"
          mkdir -p "${vendor_root}/cef" "${vendor_root}/dxc"
          tar -xjf "${WE_LAYERD_DOWNLOAD_CACHE}/${CEF_ARCHIVE}" \
            -C "${vendor_root}/cef" --strip-components=1
          tar -xzf "${WE_LAYERD_DOWNLOAD_CACHE}/${DXC_ARCHIVE}" \
            -C "${vendor_root}/dxc"

          {
            printf 'CEF_ROOT=%s\n' "${vendor_root}/cef"
            printf 'DXC_ROOT=%s\n' "${vendor_root}/dxc"
            printf 'CMAKE_PREFIX_PATH=%s\n' "${vendor_root}/dxc"
          } >> "${GITHUB_ENV}"
          printf '%s/bin\n' "${vendor_root}/dxc" >> "${GITHUB_PATH}"

      - name: Fetch locked Rust dependencies
        shell: bash
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            cargo fetch --locked

      - name: Build reusable Rust dependency graph
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 25m \
            cargo build --frozen --offline --release \
              -p we-core -p we-renderer-sys -p we-renderer -p we-gui -p xtask

      - name: Save Rust build checkpoint
        if: steps.setup.outputs.rust-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.cargo-target-dir }}
          key: ${{ steps.setup.outputs.rust-cache-key }}

      - name: Build native renderer checkpoint
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 22m \
            package/common/build-native.sh

      - name: Save completed native renderer
        if: steps.setup.outputs.native-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.native-install-root }}
          key: ${{ steps.setup.outputs.native-cache-key }}

      - name: Build final daemon binary
        shell: bash
        env:
          WE_LAYERD_INSTALL_PREFIX: /usr
          WE_LAYERD_PREBUILT_RENDERER_ROOT: ${{ steps.setup.outputs.native-install-root }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            cargo build --frozen --offline --release -p we-layerd

      - name: Stage reusable release bundle
        if: needs.validate.outputs.is_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prebuilt
          mkdir -p prebuilt/bin prebuilt/lib
          install -m0755 "${CARGO_TARGET_DIR}/release/we-layerd" prebuilt/bin/we-layerd
          install -m0755 "${CARGO_TARGET_DIR}/release/we-gui" prebuilt/bin/we-gui
          install -m0755 \
            "${WE_LAYERD_NATIVE_INSTALL_ROOT}/lib/libwallpaper-engine-renderer.so" \
            prebuilt/lib/libwallpaper-engine-renderer.so
          install -m0755 \
            "${WE_LAYERD_NATIVE_INSTALL_ROOT}/lib/we-cef-helper" \
            prebuilt/lib/we-cef-helper

      - name: Upload AppImage prebuilt checkpoint
        if: needs.validate.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-ubuntu2404-prebuilt
          path: prebuilt
          if-no-files-found: error
          retention-days: 7

      - name: Report shared compiler cache
        if: always()
        shell: bash
        run: sccache --show-stats || true

  appimage:
    name: Package Ubuntu 24.04 AppImage
    if: needs.validate.outputs.is_release == 'true'
    needs:
      - validate
      - build-appimage
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 20
    steps:
      - name: Install packaging dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            binutils build-essential bzip2 ca-certificates curl ffmpeg file git \
            gstreamer1.0-alsa \
            gstreamer1.0-libav gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-tools libasound2-dev libdrm-dev libfontconfig1-dev \
            libfreetype-dev libgl-dev libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libgtk-3-dev liblz4-dev libpango1.0-dev libva-dev libvulkan-dev \
            libwayland-dev libxdo-dev libxkbcommon-dev patchelf pkg-config \
            tar wayland-protocols xdotool xz-utils zstd

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up packaging inputs
        uses: ./.github/actions/setup-release-build
        with:
          cache-namespace: ubuntu2404-package
          source-cache-key: ${{ hashFiles('Cargo.lock') }}
          download-cache-key: ${{ hashFiles('package/common/versions.env') }}
          restore-build-caches: "false"

      - name: Download AppImage prebuilt checkpoint
        uses: actions/download-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-ubuntu2404-prebuilt
          path: prebuilt

      - name: Build AppImage without recompiling
        shell: bash
        run: WE_LAYERD_PREBUILT_ROOT="${GITHUB_WORKSPACE}/prebuilt" package/appimage/build.sh

      - name: Collect AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          artifact="package/appimage/out/we-layerd-${{ needs.validate.outputs.version }}-x86_64.AppImage"
          test -f "${artifact}"
          cp -v "${artifact}" release-assets/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-appimage-x86_64
          path: release-assets/*.AppImage
          if-no-files-found: error

  fedora:
    name: Package Fedora 44 RPM and SRPM
    if: needs.validate.outputs.is_release == 'true'
    needs: validate
    uses: ./.github/workflows/fedora-rpm.yml
    with:
      artifact_name: we-layerd-${{ needs.validate.outputs.version }}-fedora44-x86_64

  release:
    name: Publish GitHub Release
    if: needs.validate.outputs.is_release == 'true'
    needs:
      - validate
      - ubuntu
      - appimage
      - fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Ubuntu package
        uses: actions/download-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-ubuntu-amd64
          path: downloaded-artifacts/ubuntu

      - name: Download AppImage package
        uses: actions/download-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-appimage-x86_64
          path: downloaded-artifacts/appimage

      - name: Download Fedora packages
        uses: actions/download-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-fedora44-x86_64
          path: downloaded-artifacts/fedora

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' artifact; do
            filename="$(basename -- "${artifact}")"
            if [[ -e "release-assets/${filename}" ]]; then
              printf 'Duplicate release asset name: %s\n' "${filename}" >&2
              exit 1
            fi
            cp -v "${artifact}" "release-assets/${filename}"
          done < <(find downloaded-artifacts -type f -print0)

          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.x86_64.rpm' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.src.rpm' -print -quit)"
          sha256sum release-assets/* > release-assets/SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* \
              --verify-tag \
              --title "we-layerd ${VERSION}" \
              --generate-notes
          fi
