name: Release binaries

on:
  push:
    tags:
      - "v*"
      - "dev-*"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.96.1"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CMAKE_BUILD_PARALLEL_LEVEL: "1"
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  MAKEFLAGS: "-j1"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate build ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          if [[ -z "${manifest_version}" ]]; then
            printf 'Failed to read package version from Cargo.toml\n' >&2
            exit 1
          fi
          if [[ ! "${manifest_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Package version must use MAJOR.MINOR.PATCH, got %s\n' \
              "${manifest_version}" >&2
            exit 1
          fi

          is_release=false
          tag=""

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Release tag must use vMAJOR.MINOR.PATCH, got %s\n' "${tag}" >&2
              exit 1
            fi
            tag_version="${tag#v}"
            if [[ "${tag_version}" != "${manifest_version}" ]]; then
              printf 'Tag version %s does not match Cargo.toml version %s\n' \
                "${tag_version}" "${manifest_version}" >&2
              exit 1
            fi
            is_release=true
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == dev-* ]]; then
            :
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            :
          else
            printf 'Unsupported release workflow trigger: %s %s/%s\n' \
              "${GITHUB_EVENT_NAME}" "${GITHUB_REF_TYPE}" "${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          {
            printf 'version=%s\n' "${manifest_version}"
            printf 'is_release=%s\n' "${is_release}"
            printf 'tag=%s\n' "${tag}"
          } >> "${GITHUB_OUTPUT}"

  ubuntu:
    name: Build and package Ubuntu 26.04 DEB
    needs: validate
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 60
    steps:
      - name: Install build and packaging dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            binutils build-essential bzip2 ca-certificates cmake curl debhelper \
            devscripts dpkg-dev fakeroot file git libasound2-dev libdrm-dev \
            libfontconfig1-dev libfreetype-dev libgl-dev \
            libgstreamer-plugins-bad1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev libgtk-3-dev liblz4-dev libpango1.0-dev \
            libva-dev libvulkan-dev libwayland-dev libxdo-dev \
            libxkbcommon-dev patchelf pkg-config tar wayland-protocols \
            xdotool xz-utils zstd

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up clean release build
        id: setup
        uses: ./.github/actions/setup-release-build
        with:
          cache-namespace: ubuntu2604
          source-cache-key: ${{ hashFiles('Cargo.lock') }}
          download-cache-key: ${{ hashFiles('package/common/versions.env') }}

      - name: Prepare pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          source package/common/versions.env
          package/common/fetch-dependencies.sh all

          vendor_root="${GITHUB_WORKSPACE}/../.we-layerd-build/ubuntu2604/vendor"
          rm -rf "${vendor_root}"
          mkdir -p "${vendor_root}/cef" "${vendor_root}/dxc"
          tar -xjf "${WE_LAYERD_DOWNLOAD_CACHE}/${CEF_ARCHIVE}" \
            -C "${vendor_root}/cef" --strip-components=1
          tar -xzf "${WE_LAYERD_DOWNLOAD_CACHE}/${DXC_ARCHIVE}" \
            -C "${vendor_root}/dxc"

          {
            printf 'CEF_ROOT=%s\n' "${vendor_root}/cef"
            printf 'DXC_ROOT=%s\n' "${vendor_root}/dxc"
            printf 'CMAKE_PREFIX_PATH=%s\n' "${vendor_root}/dxc"
          } >> "${GITHUB_ENV}"
          printf '%s/bin\n' "${vendor_root}/dxc" >> "${GITHUB_PATH}"

      - name: Fetch locked Rust dependencies
        shell: bash
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m cargo fetch --locked

      - name: Build Rust components
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 25m \
            cargo build --frozen --offline --release \
              -p we-core -p we-renderer-sys -p we-renderer -p we-gui -p xtask

      - name: Build native renderer
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 22m package/common/build-native.sh

      - name: Build daemon
        shell: bash
        env:
          WE_LAYERD_INSTALL_PREFIX: /usr
          WE_LAYERD_PREBUILT_RENDERER_ROOT: ${{ steps.setup.outputs.native-install-root }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            cargo build --frozen --offline --release -p we-layerd

      - name: Stage package inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prebuilt
          mkdir -p prebuilt/bin prebuilt/lib
          install -m0755 "${CARGO_TARGET_DIR}/release/we-layerd" prebuilt/bin/we-layerd
          install -m0755 "${CARGO_TARGET_DIR}/release/we-gui" prebuilt/bin/we-gui
          install -m0755 \
            "${WE_LAYERD_NATIVE_INSTALL_ROOT}/lib/libwallpaper-engine-renderer.so" \
            prebuilt/lib/libwallpaper-engine-renderer.so
          install -m0755 \
            "${WE_LAYERD_NATIVE_INSTALL_ROOT}/lib/we-cef-helper" \
            prebuilt/lib/we-cef-helper

      - name: Build DEB package
        shell: bash
        run: WE_LAYERD_PREBUILT_ROOT="${GITHUB_WORKSPACE}/prebuilt" package/ubuntu/build.sh

      - name: Collect DEB package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find package/ubuntu/out -maxdepth 1 -type f -name '*.deb' \
            -exec cp -v {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-ubuntu-amd64
          path: release-assets/*.deb
          if-no-files-found: error

      - name: Report compiler cache
        if: always()
        shell: bash
        run: sccache --show-stats || true

  appimage:
    name: Build and package Ubuntu 24.04 AppImage
    needs: validate
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 70
    steps:
      - name: Install build and packaging dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            binutils build-essential bzip2 ca-certificates cmake curl ffmpeg \
            file git gstreamer1.0-alsa gstreamer1.0-libav \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-pulseaudio \
            gstreamer1.0-tools libasound2-dev libdrm-dev libfontconfig1-dev \
            libfreetype-dev libgl-dev libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libgtk-3-dev liblz4-dev libpango1.0-dev libva-dev libvulkan-dev \
            libwayland-dev libxdo-dev libxkbcommon-dev patchelf pkg-config \
            tar wayland-protocols xdotool xz-utils zstd

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up clean release build
        id: setup
        uses: ./.github/actions/setup-release-build
        with:
          cache-namespace: ubuntu2404
          source-cache-key: ${{ hashFiles('Cargo.lock') }}
          download-cache-key: ${{ hashFiles('package/common/versions.env') }}

      - name: Prepare pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          source package/common/versions.env
          package/common/fetch-dependencies.sh appimage

          vendor_root="${GITHUB_WORKSPACE}/../.we-layerd-build/ubuntu2404/vendor"
          rm -rf "${vendor_root}"
          mkdir -p "${vendor_root}/cef" "${vendor_root}/dxc"
          tar -xjf "${WE_LAYERD_DOWNLOAD_CACHE}/${CEF_ARCHIVE}" \
            -C "${vendor_root}/cef" --strip-components=1
          tar -xzf "${WE_LAYERD_DOWNLOAD_CACHE}/${DXC_ARCHIVE}" \
            -C "${vendor_root}/dxc"

          {
            printf 'CEF_ROOT=%s\n' "${vendor_root}/cef"
            printf 'DXC_ROOT=%s\n' "${vendor_root}/dxc"
            printf 'CMAKE_PREFIX_PATH=%s\n' "${vendor_root}/dxc"
          } >> "${GITHUB_ENV}"
          printf '%s/bin\n' "${vendor_root}/dxc" >> "${GITHUB_PATH}"

      - name: Fetch locked Rust dependencies
        shell: bash
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m cargo fetch --locked

      - name: Build Rust components
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 25m \
            cargo build --frozen --offline --release \
              -p we-core -p we-renderer-sys -p we-renderer -p we-gui -p xtask

      - name: Build native renderer
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 22m package/common/build-native.sh

      - name: Build daemon
        shell: bash
        env:
          WE_LAYERD_INSTALL_PREFIX: /usr
          WE_LAYERD_PREBUILT_RENDERER_ROOT: ${{ steps.setup.outputs.native-install-root }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            cargo build --frozen --offline --release -p we-layerd

      - name: Stage package inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prebuilt
          mkdir -p prebuilt/bin prebuilt/lib
          install -m0755 "${CARGO_TARGET_DIR}/release/we-layerd" prebuilt/bin/we-layerd
          install -m0755 "${CARGO_TARGET_DIR}/release/we-gui" prebuilt/bin/we-gui
          install -m0755 \
            "${WE_LAYERD_NATIVE_INSTALL_ROOT}/lib/libwallpaper-engine-renderer.so" \
            prebuilt/lib/libwallpaper-engine-renderer.so
          install -m0755 \
            "${WE_LAYERD_NATIVE_INSTALL_ROOT}/lib/we-cef-helper" \
            prebuilt/lib/we-cef-helper

      - name: Build AppImage
        shell: bash
        run: WE_LAYERD_PREBUILT_ROOT="${GITHUB_WORKSPACE}/prebuilt" package/appimage/build.sh

      - name: Collect AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          artifact="package/appimage/out/we-layerd-${{ needs.validate.outputs.version }}-x86_64.AppImage"
          test -f "${artifact}"
          cp -v "${artifact}" release-assets/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-appimage-x86_64
          path: release-assets/*.AppImage
          if-no-files-found: error

      - name: Report compiler cache
        if: always()
        shell: bash
        run: sccache --show-stats || true

  fedora:
    name: Build and package Fedora 44 RPM and SRPM
    needs: validate
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      MAKEFLAGS: "-j2"
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y \
            binutils cargo ca-certificates cef-devel cmake coreutils curl \
            desktop-file-utils findutils fontconfig-devel freetype-devel \
            gcc-c++ git grep gzip \
            gstreamer1-devel gstreamer1-plugins-bad-free-devel \
            gstreamer1-plugins-base-devel gtk3-devel libatomic libdrm-devel \
            libva-devel libxdo-devel libxkbcommon-devel lz4-devel \
            mesa-libGL-devel pango-devel patchelf pkgconf-pkg-config \
            rpm-build rust tar vulkan-headers vulkan-loader-devel \
            wayland-devel wayland-protocols-devel xz

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Resolve package cache paths
        id: cache-paths
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          workspace_parent="$(dirname -- "${GITHUB_WORKSPACE}")"
          cache_root="${workspace_parent}/.we-layerd-cache"
          cargo_home="${cache_root}/common/cargo-fedora44"
          download_cache="${cache_root}/common/downloads"

          {
            printf 'CARGO_HOME=%s\n' "${cargo_home}"
            printf 'WE_LAYERD_DOWNLOAD_CACHE=%s\n' "${download_cache}"
          } >> "${GITHUB_ENV}"

          {
            printf 'cargo-home=%s\n' "${cargo_home}"
            printf 'download-cache=%s\n' "${download_cache}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore Cargo source cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.cache-paths.outputs.cargo-home }}/registry/index
            ${{ steps.cache-paths.outputs.cargo-home }}/registry/cache
            ${{ steps.cache-paths.outputs.cargo-home }}/git/db
          key: fedora44-cargo-sources-v6-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            fedora44-cargo-sources-v6-${{ runner.arch }}-

      - name: Restore pinned packaging downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.cache-paths.outputs.download-cache }}
          key: release-downloads-v6-${{ hashFiles('package/common/versions.env') }}
          restore-keys: |
            release-downloads-v6-

      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Configure compiler cache
        shell: bash
        run: |
          {
            printf 'RUSTC_WRAPPER=sccache\n'
            printf 'CMAKE_C_COMPILER_LAUNCHER=sccache\n'
            printf 'CMAKE_CXX_COMPILER_LAUNCHER=sccache\n'
            printf 'SCCACHE_GHA_ENABLED=true\n'
          } >> "${GITHUB_ENV}"

      - name: Report build toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          rpmbuild --version

      - name: Build RPM and SRPM
        shell: bash
        run: package/fedora/build.sh

      - name: Verify package artifacts
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'package/fedora/out/RPMS/x86_64/*.rpm' >/dev/null
          compgen -G 'package/fedora/out/SRPMS/*.src.rpm' >/dev/null

      - name: Collect Fedora packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find package/fedora/out/RPMS/x86_64 -maxdepth 1 -type f -name '*.rpm' \
            -exec cp -v {} release-assets/ \;
          find package/fedora/out/SRPMS -maxdepth 1 -type f -name '*.src.rpm' \
            -exec cp -v {} release-assets/ \;

      - name: Upload Fedora artifacts
        uses: actions/upload-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-fedora44-x86_64
          path: release-assets/*.rpm
          if-no-files-found: error

      - name: Report compiler cache
        if: always()
        shell: bash
        run: sccache --show-stats || true

  release:
    name: Publish GitHub Release
    if: needs.validate.outputs.is_release == 'true'
    needs:
      - validate
      - ubuntu
      - appimage
      - fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Ubuntu package
        uses: actions/download-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-ubuntu-amd64
          path: downloaded-artifacts/ubuntu

      - name: Download AppImage package
        uses: actions/download-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-appimage-x86_64
          path: downloaded-artifacts/appimage

      - name: Download Fedora packages
        uses: actions/download-artifact@v4
        with:
          name: we-layerd-${{ needs.validate.outputs.version }}-fedora44-x86_64
          path: downloaded-artifacts/fedora

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' artifact; do
            filename="$(basename -- "${artifact}")"
            if [[ -e "release-assets/${filename}" ]]; then
              printf 'Duplicate release asset name: %s\n' "${filename}" >&2
              exit 1
            fi
            cp -v "${artifact}" "release-assets/${filename}"
          done < <(find downloaded-artifacts -type f -print0)

          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.x86_64.rpm' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.src.rpm' -print -quit)"
          sha256sum release-assets/* > release-assets/SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* \
              --verify-tag \
              --title "we-layerd ${VERSION}" \
              --generate-notes
          fi
