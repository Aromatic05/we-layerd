name: Fedora RPM package build

# Package construction only. Rendering and GPU paths require real hardware.

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name exposed to the caller
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  MAKEFLAGS: "-j2"

concurrency:
  group: fedora-rpm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rpm:
    name: Fedora 44 x86_64 RPM and SRPM
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y \
            binutils cargo ca-certificates cef-devel cmake coreutils curl \
            desktop-file-utils findutils fontconfig-devel freetype-devel \
            gcc-c++ git grep gzip \
            gstreamer1-devel gstreamer1-plugins-bad-free-devel \
            gstreamer1-plugins-base-devel gtk3-devel libatomic libdrm-devel \
            libva-devel libxdo-devel libxkbcommon-devel lz4-devel \
            mesa-libGL-devel pango-devel patchelf pkgconf-pkg-config \
            rpm-build rust tar vulkan-headers vulkan-loader-devel \
            wayland-devel wayland-protocols-devel xz

      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Resolve package cache paths
        id: cache-paths
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          workspace_parent="$(dirname -- "${GITHUB_WORKSPACE}")"
          cache_root="${workspace_parent}/.we-layerd-cache"
          cargo_home="${cache_root}/common/cargo-fedora44"
          download_cache="${cache_root}/common/downloads"

          {
            printf 'CARGO_HOME=%s\n' "${cargo_home}"
            printf 'WE_LAYERD_DOWNLOAD_CACHE=%s\n' "${download_cache}"
          } >> "${GITHUB_ENV}"

          {
            printf 'cargo-home=%s\n' "${cargo_home}"
            printf 'download-cache=%s\n' "${download_cache}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore Cargo source cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.cache-paths.outputs.cargo-home }}/registry/index
            ${{ steps.cache-paths.outputs.cargo-home }}/registry/cache
            ${{ steps.cache-paths.outputs.cargo-home }}/git/db
          key: fedora44-cargo-sources-v1-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            fedora44-cargo-sources-v1-${{ runner.arch }}-

      - name: Restore pinned packaging downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.cache-paths.outputs.download-cache }}
          key: release-downloads-v5-${{ hashFiles('package/common/versions.env') }}
          restore-keys: |
            release-downloads-v5-

      - name: Enable trusted compiler cache
        if: github.event_name != 'pull_request'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Configure trusted compiler cache
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            printf 'RUSTC_WRAPPER=sccache\n'
            printf 'CMAKE_C_COMPILER_LAUNCHER=sccache\n'
            printf 'CMAKE_CXX_COMPILER_LAUNCHER=sccache\n'
            printf 'SCCACHE_GHA_ENABLED=true\n'
          } >> "${GITHUB_ENV}"

      - name: Report build toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          rpmbuild --version

      - name: Build RPM and SRPM
        shell: bash
        run: package/fedora/build.sh

      - name: Verify package artifacts
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'package/fedora/out/RPMS/x86_64/*.rpm' >/dev/null
          compgen -G 'package/fedora/out/SRPMS/*.src.rpm' >/dev/null

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || format('we-layerd-fedora44-x86_64-{0}', github.sha) }}
          path: |
            package/fedora/out/RPMS/x86_64/*.rpm
            package/fedora/out/SRPMS/*.src.rpm
          if-no-files-found: error

      - name: Report trusted compiler cache
        if: github.event_name != 'pull_request' && always()
        shell: bash
        run: sccache --show-stats || true
