name: Setup release build
description: Restore verified source caches, install the pinned Rust toolchain, and prepare clean build paths.

inputs:
  cache-namespace:
    description: Distribution-specific namespace for ephemeral build outputs.
    required: true
  source-cache-key:
    description: Hash of Cargo.lock.
    required: true
  download-cache-key:
    description: Hash of pinned external dependency versions.
    required: true

outputs:
  cargo-target-dir:
    value: ${{ steps.paths.outputs.cargo-target-dir }}
  native-build-root:
    value: ${{ steps.paths.outputs.native-build-root }}
  native-install-root:
    value: ${{ steps.paths.outputs.native-install-root }}

runs:
  using: composite
  steps:
    - name: Resolve container-visible build and cache paths
      id: paths
      shell: bash
      env:
        CACHE_NAMESPACE: ${{ inputs.cache-namespace }}
      run: |
        set -euo pipefail

        git config --global --add safe.directory "${GITHUB_WORKSPACE}"

        workspace_parent="$(dirname -- "${GITHUB_WORKSPACE}")"
        cache_root="${workspace_parent}/.we-layerd-cache"
        build_root="${workspace_parent}/.we-layerd-build/${CACHE_NAMESPACE}"
        cargo_home="${cache_root}/common/cargo"
        rustup_home="${cache_root}/common/rustup"
        download_cache="${cache_root}/common/downloads"
        cargo_target="${build_root}/cargo-target"
        native_build="${build_root}/native-build"
        native_install="${build_root}/native-install"

        rm -rf "${build_root}"
        mkdir -p \
          "${cargo_home}" \
          "${rustup_home}" \
          "${download_cache}" \
          "${cargo_target}" \
          "${native_build}" \
          "${native_install}"

        {
          printf 'CARGO_HOME=%s\n' "${cargo_home}"
          printf 'RUSTUP_HOME=%s\n' "${rustup_home}"
          printf 'WE_LAYERD_DOWNLOAD_CACHE=%s\n' "${download_cache}"
          printf 'CARGO_TARGET_DIR=%s\n' "${cargo_target}"
          printf 'WE_LAYERD_NATIVE_BUILD_ROOT=%s\n' "${native_build}"
          printf 'WE_LAYERD_NATIVE_INSTALL_ROOT=%s\n' "${native_install}"
          printf 'WE_LAYERD_REUSE_NATIVE_INSTALL=0\n'
        } >> "${GITHUB_ENV}"

        {
          printf 'cargo-home=%s\n' "${cargo_home}"
          printf 'rustup-home=%s\n' "${rustup_home}"
          printf 'download-cache=%s\n' "${download_cache}"
          printf 'cargo-target-dir=%s\n' "${cargo_target}"
          printf 'native-build-root=%s\n' "${native_build}"
          printf 'native-install-root=%s\n' "${native_install}"
        } >> "${GITHUB_OUTPUT}"

    - name: Restore pinned Rust toolchain
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.paths.outputs.cargo-home }}/bin
          ${{ steps.paths.outputs.rustup-home }}
        key: release-rustup-v6-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}

    - name: Restore Cargo source cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.paths.outputs.cargo-home }}/registry/index
          ${{ steps.paths.outputs.cargo-home }}/registry/cache
          ${{ steps.paths.outputs.cargo-home }}/git/db
        key: release-cargo-sources-v6-${{ runner.arch }}-${{ inputs.source-cache-key }}
        restore-keys: |
          release-cargo-sources-v6-${{ runner.arch }}-

    - name: Restore checksum-verified packaging downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.paths.outputs.download-cache }}
        key: release-downloads-v6-${{ inputs.download-cache-key }}
        restore-keys: |
          release-downloads-v6-

    - name: Enable content-addressed compiler cache
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.16.0"

    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
        export PATH="${CARGO_HOME}/bin:${PATH}"

        if [[ ! -x "${CARGO_HOME}/bin/rustup" ]]; then
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://sh.rustup.rs \
            | sh -s -- -y --profile minimal \
                --default-toolchain "${RUST_TOOLCHAIN}" --no-modify-path
        elif rustup toolchain list | grep -Eq "^${RUST_TOOLCHAIN}(-| )"; then
          rustup default "${RUST_TOOLCHAIN}"
        else
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
        fi

        rustc -Vv
        cargo -V

        probe_dir="$(mktemp -d)"
        trap 'rm -rf "${probe_dir}"' EXIT
        printf 'fn main() {}\n' > "${probe_dir}/main.rs"
        rustc "${probe_dir}/main.rs" -o "${probe_dir}/main"
        readelf -p .comment "${probe_dir}/main" | grep -F 'Linker: LLD'
