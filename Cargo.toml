[package]
name = "we-layerd"
version = "0.2.6"
edition = "2021"

[workspace]
members = [
    "crates/we-core",
    "crates/we-renderer-sys",
    "crates/we-renderer",
    "apps/we-gui",
    "xtask",
]
resolver = "2"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
we-core = { path = "crates/we-core" }
we-renderer = { path = "crates/we-renderer" }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = "4.4"

[profile.release]
strip = "symbols"
